    <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.45" />
  </filter>

  <g filter="url(#shadow)">
    <!-- Map Pin Outer Body -->
    <path d="M16 2.5C10.2 2.5 5.5 7.2 5.5 13C5.5 20.8 16 28 16 28C16 28 26.5 20.8 26.5 13C26.5 7.2 21.8 2.5 16 2.5Z" fill="#F7F2E8" stroke="#1F1D1B" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner circular plate line -->
    <circle cx="16" cy="13" r="7" fill="none" stroke="#1F1D1B" stroke-width="1.8"/>
    
    <!-- Fork (Left) -->
    <!-- Fork prongs and neck -->
    <path d="M13.8 8.8V12C13.8 12.8 14.5 13.3 15 13.3V17.2" stroke="#1F1D1B" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M12.6 8.8V11.2C12.6 12 13.3 12.5 14 12.6" stroke="#1F1D1B" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M15 8.8V11.2" stroke="#1F1D1B" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Knife (Right) -->
